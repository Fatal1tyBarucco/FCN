name: Deploy GitHub Pages

# Este fluxo roda em push para `main` (e manualmente via workflow_dispatch).
# Ele (1) verifica a sintaxe de todos os JS e (2) só então publica a apostila
# como site estático no GitHub Pages.
#
# DECISÃO: o artifact aponta para `apostila-ia/` (e não para a raiz do repo),
# para que a raiz do site publicado seja `apostila-ia/index.html`. Isso mantém
# a estrutura do app descrita no AGENTS.md do projeto (o app vive em
# `apostila-ia/`, e o `Escrita.txt` é a fonte de requisitos), sem mover código.
#
# DECISÃO (P0 — links do inventário/matriz no Pages): a action oficial
# `actions/upload-pages-artifact` aceita UM ÚNICO diretório em `path`
# ("Path of the directory containing the static assets"; o passo composite
# executa `tar --directory "$INPUT_PATH" ... .` — action.yml oficial,
# main), portanto não dá para subir `apostila-ia/`, `inventario/` e
# `matriz/` de uma vez. Como a raiz do site é `apostila-ia/`, o job de
# deploy COPIA `inventario/` e `matriz/` para dentro de `apostila-ia/`
# antes do upload. A fonte de verdade continua sendo a raiz do repositório
# (`inventario/`, `matriz/`); a cópia versionada dentro de `apostila-ia/`
# existe para que os links relativos do `index.html` funcionem também na
# abertura direta (Modo A, `file://`), e o `cp` do build a re-sincroniza a
# cada deploy. Os links no `index.html` são, por isso, relativos e sem `../`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões mínimas necessárias:
# - contents: read  -> ler o código
# - pages: write    -> publicar no GitHub Pages
# - id-token: write -> gerar o token OIDC exigido pelo deploy do Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ambiente exigido pelas actions oficiais do Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job de verificação: roda ANTES do deploy (via `needs`).
  verificar:
    name: Verificar sintaxe JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: node --check em todos os JS (apostila-ia)
        run: |
          set -euo pipefail
          arquivos=$(find apostila-ia/assets -type f -name '*.js' | sort)
          echo "Arquivos verificados:"
          echo "$arquivos"
          total=0
          for f in $arquivos; do
            echo "node --check $f"
            node --check "$f"
            total=$((total + 1))
          done
          echo "OK: $total arquivo(s) verificados, 0 falhas."

  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    # Só publica se a verificação de sintaxe passar.
    needs: verificar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Copiar documentos de governança para o artefato
        # Ver "DECISÃO (P0 — links do inventário/matriz no Pages)" no cabeçalho:
        # upload-pages-artifact só aceita um diretório, então inventario/ e
        # matriz/ (fonte, na raiz do repo) são copiados para a raiz do site.
        run: |
          set -euo pipefail
          cp -R inventario apostila-ia/
          cp -R matriz apostila-ia/
          test -f apostila-ia/inventario/INVENTARIO_CURRICULAR.md
          test -f apostila-ia/matriz/MATRIZ_COBERTURA.md
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Raiz do site = apostila-ia/ (ver decisão no cabeçalho deste arquivo).
          # Após o `cp` acima, o diretório também contém inventario/ e matriz/.
          path: apostila-ia
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
