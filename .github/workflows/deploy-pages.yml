name: Deploy GitHub Pages

# Este fluxo roda em push para `main` (e manualmente via workflow_dispatch).
# Ele (1) verifica a sintaxe de todos os JS e (2) só então publica a apostila
# como site estático no GitHub Pages.
#
# DECISÃO: o artifact aponta para `apostila-ia/` (e não para a raiz do repo),
# para que a raiz do site publicado seja `apostila-ia/index.html`. Isso mantém
# a estrutura do app descrita no AGENTS.md do projeto (o app vive em
# `apostila-ia/`, e o `Escrita.txt` é a fonte de requisitos), sem mover código.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões mínimas necessárias:
# - contents: read  -> ler o código
# - pages: write    -> publicar no GitHub Pages
# - id-token: write -> gerar o token OIDC exigido pelo deploy do Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ambiente exigido pelas actions oficiais do Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job de verificação: roda ANTES do deploy (via `needs`).
  verificar:
    name: Verificar sintaxe JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: node --check em todos os JS (apostila-ia)
        run: |
          set -euo pipefail
          arquivos=$(find apostila-ia/assets -type f -name '*.js' | sort)
          echo "Arquivos verificados:"
          echo "$arquivos"
          total=0
          for f in $arquivos; do
            echo "node --check $f"
            node --check "$f"
            total=$((total + 1))
          done
          echo "OK: $total arquivo(s) verificados, 0 falhas."

  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    # Só publica se a verificação de sintaxe passar.
    needs: verificar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Raiz do site = apostila-ia/ (ver decisão no cabeçalho deste arquivo).
          path: apostila-ia
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
