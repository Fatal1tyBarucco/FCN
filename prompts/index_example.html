<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apostila Definitiva de TI e Dados | MasterClass Concursos</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-box-and-violin-plot"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f8fafc; --text-dim: #94a3b8;
  --primary: #3b82f6; --success: #10b981; --error: #ef4444; --warning: #f59e0b; --accent: #8b5cf6;
  --radius: 8px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
}
[data-theme="light"] {
  --bg: #f1f5f9; --surface: #ffffff; --border: #cbd5e1; --text: #0f172a; --text-dim: #475569;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; display: flex; min-height: 100vh; overflow-x: hidden; }
h1,h2,h3,h4 { color: var(--text); margin-bottom: 1rem; line-height: 1.2; }
h1 { font-size: 2.2rem; border-bottom: 3px solid var(--primary); padding-bottom: 0.5rem; }
h2 { font-size: 1.6rem; color: var(--primary); border-left: 4px solid var(--primary); padding-left: 1rem; margin-top: 2rem; }
h3 { font-size: 1.3rem; margin-top: 1.5rem; color: var(--accent); }
p { margin-bottom: 1rem; color: var(--text); }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
code { background: #00000040; padding: 2px 6px; border-radius: 4px; font-family: 'Fira Code', monospace; font-size: 0.9em; color: #fbbf24; }
pre { background: #00000080; padding: 1rem; border-radius: var(--radius); overflow-x: auto; margin: 1rem 0; border-left: 4px solid var(--accent); }
pre code { background: none; padding: 0; color: #e2e8f0; }
ul, ol { margin-left: 2rem; margin-bottom: 1rem; }
table { width: 100%; border-collapse: collapse; margin: 1rem 0; background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
th { background: var(--primary); color: white; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
tr:nth-child(even) { background: #ffffff05; }
.badge { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
.badge-blue { background: #1e3a8a; color: #93c5fd; }
.badge-green { background: #064e3b; color: #6ee7b7; }
.badge-red { background: #7f1d1d; color: #fca5a5; }
.badge-yellow { background: #78350f; color: #fcd34d; }
.badge-purple { background: #4c1d95; color: #c4b5fd; }

/* Layout */
#sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); height: 100vh; position: sticky; top: 0; overflow-y: auto; padding: 1rem; flex-shrink: 0; z-index: 100; }
#sidebar h2 { font-size: 1.2rem; text-align: center; border: none; padding: 0; margin-bottom: 1.5rem; color: var(--primary); }
#sidebar .nav-item { display: block; padding: 12px; border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; transition: 0.2s; color: var(--text-dim); border-left: 3px solid transparent; font-weight: 500; }
#sidebar .nav-item:hover { background: #ffffff10; color: var(--text); }
#sidebar .nav-item.active { background: var(--primary); color: white; border-left-color: var(--warning); }
#sidebar .progress-mini { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
#sidebar .progress-mini-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.3s; }

#main { flex: 1; padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
#header { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; z-index: 90; backdrop-filter: blur(10px); margin: -2rem -2rem 2rem -2rem; width: calc(100% + 4rem); }
#header .left { display: flex; align-items: center; gap: 1rem; }
#header .progress-global { width: 200px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
#header .progress-global-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.5s; }
#header .search-box { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text); width: 300px; }
#header .btn { padding: 8px 16px; border-radius: var(--radius); border: none; background: var(--primary); color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
#header .btn:hover { opacity: 0.9; transform: translateY(-1px); }
#header .btn-sec { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

/* Components */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow); }
.card h3 { margin-top: 0; }
.tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 1.5rem; overflow-x: auto; }
.tab { padding: 12px 24px; cursor: pointer; border-bottom: 3px solid transparent; font-weight: 600; color: var(--text-dim); white-space: nowrap; transition: 0.2s; }
.tab:hover { color: var(--text); }
.tab.active { border-bottom-color: var(--primary); color: var(--primary); }
.tab-content { display: none; animation: fadeIn 0.3s; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

details { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin: 1rem 0; }
summary { cursor: pointer; font-weight: bold; color: var(--primary); padding: 0.5rem; }
summary:hover { color: var(--accent); }

/* Flashcards */
.fc-deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem; }
.fc-card { height: 200px; perspective: 1000px; cursor: pointer; }
.fc-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
.fc-card.flipped .fc-inner { transform: rotateY(180deg); }
.fc-front, .fc-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius); padding: 1.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: var(--shadow); overflow-y: auto; }
.fc-front { background: var(--primary); color: white; font-weight: bold; font-size: 1.1rem; }
.fc-back { background: var(--surface); color: var(--text); border: 2px solid var(--primary); transform: rotateY(180deg); font-size: 0.95rem; }
.fc-actions { display: flex; gap: 0.5rem; margin-top: 1rem; width: 100%; }
.fc-actions button { flex: 1; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
.fc-btn-easy { background: var(--success); }
.fc-btn-hard { background: var(--warning); }
.fc-btn-wrong { background: var(--error); }

/* Quiz */
.quiz-q { background: var(--surface); border-left: 4px solid var(--accent); padding: 1.5rem; margin-bottom: 1.5rem; border-radius: var(--radius); }
.quiz-opts label { display: block; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); margin: 8px 0; cursor: pointer; transition: 0.2s; }
.quiz-opts label:hover { background: #ffffff05; border-color: var(--primary); }
.quiz-opts input { margin-right: 10px; }
.quiz-opts label.correct { background: #10b98130; border-color: var(--success); }
.quiz-opts label.wrong { background: #ef444430; border-color: var(--error); }
.quiz-exp { display: none; background: #00000040; padding: 1rem; border-radius: var(--radius); margin-top: 1rem; border-left: 3px solid var(--warning); font-size: 0.9rem; }
.quiz-exp.show { display: block; }

/* Simulators */
.sim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 1rem; }
.sim-input textarea, .sim-input input { width: 100%; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1rem; font-family: inherit; }
.sim-output { background: #000; color: #0f0; padding: 1rem; border-radius: var(--radius); font-family: monospace; min-height: 200px; white-space: pre-wrap; }
.excel-grid { display: grid; grid-template-columns: 40px repeat(5, 1fr); gap: 2px; background: var(--border); padding: 2px; border-radius: 4px; margin-bottom: 1rem; }
.excel-grid input { width: 100%; padding: 8px; border: none; background: var(--surface); color: var(--text); text-align: center; font-size: 0.9rem; }
.excel-grid .hdr { background: var(--primary); color: white; font-weight: bold; padding: 8px; text-align: center; }
.phish-email { border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; background: var(--surface); }
.phish-email .hdr { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 0.5rem; font-size: 0.9rem; }
.phish-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
.phish-btn { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
.phish-btn.safe { background: var(--success); }
.phish-btn.danger { background: var(--error); }

/* Charts */
.chart-controls { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.chart-controls select, .chart-controls button { padding: 8px 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
.chart-container { background: var(--surface); padding: 1.5rem; border-radius: var(--radius); height: 400px; position: relative; }

/* Modal */
.modal { display: none; position: fixed; inset: 0; background: #000000cc; z-index: 1000; justify-content: center; align-items: center; padding: 2rem; }
.modal.show { display: flex; }
.modal-content { background: var(--surface); border-radius: var(--radius); padding: 2rem; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
.modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }

/* Responsive */
@media (max-width: 768px) {
  body { flex-direction: column; }
  #sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
  #main { padding: 1rem; }
  #header { flex-direction: column; gap: 1rem; width: 100%; margin: 0 0 1rem 0; padding: 1rem; width: 100%; }
  #header .search-box { width: 100%; }
  .sim-grid { grid-template-columns: 1fr; }
}

/* Utilities */
.text-center { text-align: center; }
.mt-1 { margin-top: 1rem; } .mb-1 { margin-bottom: 1rem; }
.flex { display: flex; gap: 1rem; } .flex-1 { flex: 1; }
.hidden { display: none !important; }
.highlight { background: #f59e0b40; padding: 2px 4px; border-radius: 2px; }
.tts-controls { display: flex; gap: 0.5rem; align-items: center; background: var(--surface); padding: 8px; border-radius: 20px; }
.tts-controls button { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; padding: 4px 8px; }
.tts-controls select { background: var(--bg); color: var(--text); border: none; padding: 4px; border-radius: 4px; }

/* Mermaid overrides */
.mermaid { display: flex; justify-content: center; margin: 1rem 0; }
.mermaid svg { max-width: 100%; height: auto; }

/* Infographics CSS */
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1rem 0; }
.info-box { background: linear-gradient(135deg, var(--surface), #ffffff10); border: 1px solid var(--border); padding: 1.5rem; border-radius: var(--radius); text-align: center; transition: 0.3s; }
.info-box:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 20px #00000040; }
.info-box .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
.info-box h4 { color: var(--primary); font-size: 1.1rem; margin-bottom: 0.5rem; }

/* Video embed */
.video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: var(--radius); margin: 1rem 0; border: 2px solid var(--border); }
.video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.mark-complete { display: block; width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: var(--radius); font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 2rem; transition: 0.2s; }
.mark-complete:hover { background: #059669; }
.mark-complete.completed { background: var(--border); color: var(--text-dim); cursor: default; }
</style>
</head>
<body>

<aside id="sidebar">
  <h2>📚 Apostila Master TI</h2>
  <div id="nav-list"></div>
</aside>

<main id="main">
  <div id="header">
    <div class="left">
      <strong>Progresso Global:</strong>
      <div class="progress-global"><div class="progress-global-bar" id="global-progress"></div></div>
      <span id="progress-text">0%</span>
    </div>
    <div class="right flex">
      <input type="text" id="search-input" class="search-box" placeholder="🔍 Buscar em toda a apostila...">
      <div class="tts-controls">
        <button id="tts-play" title="Ouvir">🔊</button>
        <button id="tts-pause" title="Pausar">⏸️</button>
        <select id="tts-rate" title="Velocidade">
          <option value="0.8">0.8x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.2">1.2x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>
      <button class="btn btn-sec" onclick="App.toggleTheme()">🌓 Tema</button>
    </div>
  </div>

  <div id="content-area"></div>
</main>

<!-- Modal para Flashcards e Quiz -->
<div id="modal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="App.closeModal()">✖</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ==========================================
// BANCO DE DADOS INTEGRAL DA APOSTILA
// ==========================================
const DB = {
  modules: [
    {
      id: 'msoffice',
      title: '1. MS Office 365',
      icon: '📊',
      overview: 'O ecossistema Microsoft 365 domina os editais. A banca exige conhecimento das diferenças entre versões Web e Desktop, domínio de fórmulas complexas do Excel (PROCX, SE aninhado) e governança de compartilhamento no OneDrive/SharePoint.',
      theory: `
        <h2>1. Word: Formatação Avançada e Colaboração</h2>
        <p><strong>Iniciante:</strong> Estilos são a espinha dorsal de documentos profissionais. Nunca formate parágrafos manualmente; use "Normal", "Título 1", "Título 2". Isso permite gerar Sumários Automáticos com um clique.</p>
        <p><strong>Intermediário:</strong> <em>Quebras de Seção</em> são vitais para misturar orientação de página (Paisagem/Retrato) ou numeração diferente no mesmo arquivo. O recurso "Controlar Alterações" registra cada edição para revisão colaborativa.</p>
        <p><strong>Avançado (Pegadinha CESPE):</strong> A proteção de documento pode ser restrita a "Apenas Comentários" ou "Preenchimento de Formulários". A senha de proteção é fraca (hash simples) e fácil de remover; não confunda com criptografia do arquivo (AES-256).</p>

        <h2>2. Excel: O Coração dos Concursos</h2>
        <h3>Referências: Relativas vs Absolutas</h3>
        <ul>
          <li><code>A1</code> (Relativa): Muda ao copiar a fórmula.</li>
          <li><code>$A$1</code> (Absoluta): Travada, não muda.</li>
          <li><code>$A1</code> ou <code>A$1</code> (Mista): Trava só coluna ou só linha.</li>
        </ul>
        
        <h3>Funções Críticas</h3>
        <table>
          <tr><th>Função</th><th>Uso</th><th>Observação de Banca</th></tr>
          <tr><td><code>SE(teste; V; F)</code></td><td>Condicional lógica.</td><td>Pode ser aninhado até 64 níveis.</td></tr>
          <tr><td><code>PROCV(valor; matriz; num_col; [proc]</code></td><td>Busca vertical na 1ª coluna.</td><td>O 4º parâmetro é crucial: 0/FALSO para exata. Se omitir, faz busca aproximada (erro clássico).</td></tr>
          <tr><td><code>PROCX</code></td><td>Evolução do PROCV.</td><td>Busca em qualquer direção, não trava na 1ª coluna, retorna #N/D nativo se não achar.</td></tr>
          <tr><td><code>ÍNDICE + CORRESP</code></td><td>Combo dinâmico.</td><td>CORRESP retorna a posição (número), ÍNDICE retorna o valor naquela posição. Mais flexível que PROCV.</td></tr>
          <tr><td><code>CONT.SE / SOMASE</code></td><td>Agregação condicional.</td><td>Use <code>CONT.SES</code> para múltiplos critérios.</td></tr>
        </table>

        <h2>3. PowerPoint: Slide Master e Empacotamento</h2>
        <p>O <strong>Slide Mestre (Slide Master)</strong> é o template global. Alterar o Slide Mestre afeta todos os slides do layout. É onde se insere logotipos corporativos em todas as páginas de uma vez. O recurso "Empacotar para CD/CD-ROM" (ou Pacote para Apresentação) salva as fontes incorporadas e links de mídia para evitar quebras em outros PCs.</p>

        <h2>4. OneDrive e Governança</h2>
        <p><strong>Versionamento:</strong> O OneDrive mantém histórico de versões. Se um arquivo for corrompido por ransomware, você pode restaurar uma versão de 24h atrás. <strong>Compartilhamento:</strong> Links podem ser "Qualquer pessoa" (público), "Pessoas na organização" ou "Pessoas específicas". A banca ama cobrar que "Qualquer pessoa com o link" tem acesso, mesmo sem conta Microsoft.</p>
      `,
      mermaid: `graph TD
        A[Fórmula Excel] --> B{Tipo de Referência?}
        B -->|A1| C[Relativa: Muda ao arrastar]
        B -->|$A$1| D[Absoluta: Fixa em qualquer célula]
        B -->|$A1 ou A$1| E[Mista: Fixa linha OU coluna]
        C --> F[Cálculo Dinâmico]
        D --> G[Constantes Globais ex: Taxa de Imposto]`,
      videos: [{id: "dQw4w9WgXcQ", title: "Excel para Concursos (Simulação)"}],
      lightning: [
        'PROCV procura na PRIMEIRA coluna da matriz. PROCX não tem essa limitação.',
        'Quebra de Página vs Quebra de Seção: Seção permite orientação de página diferente.',
        'Slide Mestre altera o template global de uma só vez.',
        'Referência Absoluta usa o cifrão ($). Ex: $A$1.',
        'OneDrive permite versionamento para reverter ransomware.'
      ],
      flashcards: [
        {q: "Qual a diferença entre PROCV e PROCX?", a: "PROCV busca apenas na 1ª coluna da direita para a esquerda. PROCX busca em qualquer coluna/direção e trata erros nativamente."},
        {q: "O que o cifrão ($) faz no Excel?", a: "Trava a referência da célula (Absoluta ou Mista), impedindo que ela mude ao copiar a fórmula."},
        {q: "Para que serve o Slide Mestre no PowerPoint?", a: "Para aplicar formatação, logotipos ou planos de fundo em TODOS os slides (ou layouts) de uma só vez."},
        {q: "Qual a função da 'Quebra de Seção' no Word?", a: "Permite formatar partes do documento de forma independente (ex: orientação paisagem em uma página, numeração diferente)."},
        {q: "O que é o 'Controlar Alterações' no Word?", a: "Recurso que registra inserções, exclusões e formatações para revisão colaborativa posterior."},
        {q: "No OneDrive, o que significa um link de compartilhamento 'Qualquer pessoa'?", a: "É um link público. Qualquer pessoa com o link pode acessar, sem necessidade de login ou permissão explícita."},
        {q: "Qual a diferença entre CONT.SE e CONT.SES?", a: "CONT.SE avalia apenas um critério. CONT.SES permite múltiplos critérios em colunas diferentes (E lógico)."},
        {q: "O que a função CORRESP retorna?", a: "A POSIÇÃO RELATIVA (número) de um item em um intervalo, não o valor em si."},
        {q: "Como o OneDrive protege contra Ransomware?", a: "Através do versionamento de arquivos, permitindo restaurar o OneDrive inteiro para um ponto no tempo (ex: 24h atrás)."},
        {q: "O que é 'Empacotar Apresentação' no PPT?", a: "Recurso que salva o arquivo junto com fontes incorporadas e mídias vinculadas para garantir fidelidade em outros PCs."}
      ],
      quiz: [
        {
          q: "(CESPE) No Excel, a fórmula =$A1+B$1, quando copiada da célula C1 para a célula D2, resultará em =$A2+C$1.",
          opts: ["Certo", "Errado"],
          ans: 0,
          exp: "Certo. A coluna A está travada ($A), então continua A. A linha 1 não está travada, então vira 2. Na segunda parte, a coluna B não está travada, vira C. A linha 1 está travada ($1), continua 1."
        },
        {
          q: "(FGV) A função PROCX foi introduzida para substituir o PROCV. Qual das alternativas abaixo é uma vantagem EXCLUSIVA do PROCX?",
          opts: ["Buscar valores em ordem alfabética", "Retornar valores à esquerda da coluna de busca", "Somar valores automaticamente", "Criar tabelas dinâmicas"],
          ans: 1,
          exp: "O PROCV só busca à direita da coluna de pesquisa. O PROCX elimina essa restrição, podendo buscar em qualquer direção."
        },
        {
          q: "(FCC) Sobre o Word, a inserção de uma 'Quebra de Seção' do tipo 'Contínua' tem como principal objetivo:",
          opts: ["Iniciar um novo capítulo", "Permitir formatações diferentes (ex: colunas) na mesma página", "Inserir uma nova página em branco", "Proteger o documento com senha"],
          ans: 1,
          exp: "A quebra contínua permite mudar formatação (como número de colunas de jornal) sem forçar uma nova página."
        },
        {
          q: "(VUNESP) No PowerPoint, se um analista precisa inserir a logomarca do órgão em todos os 50 slides da apresentação no mesmo canto superior direito, a forma mais eficiente e técnica é:",
          opts: ["Copiar e colar a imagem em cada slide", "Usar o Slide Mestre (Slide Master)", "Usar a guia Inserir > Imagem", "Aplicar uma animação de entrada"],
          ans: 1,
          exp: "O Slide Mestre é o template global. Alterações nele refletem em todos os slides associados ao layout."
        }
      ]
    },
    {
      id: 'redes',
      title: '2. Redes de Computadores',
      icon: '🌐',

      theory: `
        <h2>2.1 Modelos OSI e TCP/IP</h2>
        <p>A <strong>OSI (Open Systems Interconnection)</strong> é um modelo teórico de 7 camadas. O <strong>TCP/IP</strong> é o modelo prático de 4 camadas usado na Internet.</p>
        <table>
          <tr><th>Camada OSI</th><th>Nome</th><th>Protocolos/Dispositivos</th><th>TCP/IP</th></tr>
          <tr><td>7</td><td>Aplicação</td><td>HTTP, HTTPS, SMTP, FTP, DNS</td><td>Aplicação</td></tr>
          <tr><td>6</td><td>Apresentação</td><td>SSL/TLS, JPEG, ASCII</td><td>Aplicação</td></tr>
          <tr><td>5</td><td>Sessão</td><td>NetBIOS, RPC</td><td>Aplicação</td></tr>
          <tr><td>4</td><td>Transporte</td><td>TCP (confiável), UDP (rápido)</td><td>Transporte</td></tr>
          <tr><td>3</td><td>Rede</td><td>IP, ICMP, Roteadores</td><td>Internet</td></tr>
          <tr><td>2</td><td>Enlace</td><td>Ethernet, MAC, Switches</td><td>Enlace</td></tr>
          <tr><td>1</td><td>Física</td><td>Cabos, Hubs, Bits</td><td>Enlace</td></tr>
        </table>

        <h2>Portas e Protocolos Críticos (Decoreba)</h2>
        <table>
          <tr><th>Protocolo</th><th>Porta</th><th>Transporte</th><th>Função</th></tr>
          <tr><td>FTP (Dados)</td><td>20</td><td>TCP</td><td>Transferência de arquivos</td></tr>
          <tr><td>FTP (Controle)</td><td>21</td><td>TCP</td><td>Transferência de arquivos</td></tr>
          <tr><td>SSH</td><td>22</td><td>TCP</td><td>Acesso remoto criptografado</td></tr>
          <tr><td>Telnet</td><td>23</td><td>TCP</td><td>Acesso remoto em texto plano (inseguro)</td></tr>
          <tr><td>SMTP</td><td>25 / 587</td><td>TCP</td><td>Envio de e-mails</td></tr>
          <tr><td>DNS</td><td>53</td><td>TCP/UDP</td><td>Traduz nomes para IPs</td></tr>
          <tr><td>DHCP</td><td>67/68</td><td>UDP</td><td>Atribui IPs automaticamente</td></tr>
          <tr><td>HTTP</td><td>80</td><td>TCP</td><td>Web não segura</td></tr>
          <tr><td>POP3</td><td>110</td><td>TCP</td><td>Receber e-mails (baixa e apaga)</td></tr>
          <tr><td>IMAP</td><td>143</td><td>TCP</td><td>Receber e-mails (sincroniza)</td></tr>
          <tr><td>HTTPS</td><td>443</td><td>TCP</td><td>Web segura (SSL/TLS)</td></tr>
          <tr><td>RDP</td><td>3389</td><td>TCP</td><td>Área de Trabalho Remota</td></tr>
        </table>

        <h2>Ferramentas de Diagnóstico</h2>
        <ul>
          <li><code>ping</code>: Testa conectividade usando ICMP (ECHO REQUEST/REPLY). Mede latência e perda de pacotes.</li>
          <li><code>traceroute / tracert</code>: Mostra os saltos (roteadores) até o destino. Usa TTL (Time To Live) para mapear a rota.</li>
          <li><code>nslookup / dig</code>: Consulta servidores DNS para resolver nomes em IPs.</li>
          <li><code>netstat</code>: Exibe conexões ativas, portas abertas e estatísticas de protocolo.</li>
          <li><code>ipconfig / ifconfig</code>: Exibe a configuração de rede da interface (IP, Máscara, Gateway).</li>
        </ul>

        <h2>IPv4, Sub-redes e NAT</h2>
        <p><strong>NAT (Network Address Translation):</strong> Permite que múltiplos dispositivos em uma rede privada (IPs não roteáveis como 192.168.x.x) acessem a internet usando um único IP público. O roteador traduz as portas de origem.</p>
        <p><strong>Classes de IP (Classful):</strong> A (0-127, /8), B (128-191, /16), C (192-223, /24). Hoje usamos CIDR (ex: /24 = 255.255.255.0).</p>
        <p><strong>IPv6:</strong> 128 bits, hexadecimal. Elimina a necessidade de NAT e broadcast (usa multicast/anycast).</p>

        <h2>VPN e Extranet</h2>
        <p><strong>VPN:</strong> Cria um túnel criptografado sobre uma rede pública. Protocolos: PPTP (obsoleto), L2TP/IPsec, OpenVPN, WireGuard. Garante confidencialidade e integridade.</p>
        <p><strong>Extranet:</strong> Rede privada estendida para parceiros/fornecedores externos via autenticação segura. Diferente da Intranet (interna) e Internet (pública).</p>

      theory: `
        <h2>7.1 A Pirâmide DIKW</h2>
        <p>A evolução do valor semântico dos ativos informacionais:</p>
        <ul>
          <li><strong>Dados:</strong> Fatos brutos, símbolos sem contexto (ex: "38", "SP").</li>
          <li><strong>Informação:</strong> Dados processados com contexto (ex: "38°C em SP").</li>
          <li><strong>Conhecimento:</strong> Informação aplicada, padrões (ex: "38°C indica onda de calor").</li>
          <li><strong>Sabedoria:</strong> Julgamento ético e ação baseada no conhecimento (ex: "Devemos emitir alerta de saúde").</li>
        </ul>

        <h2>7.2 Qualidade de Dados (Dimensões)</h2>
        <table>
          <tr><th>Dimensão</th><th>Pergunta Chave</th><th>Exemplo de Falha</th></tr>
          <tr><td><strong>Acurácia</strong></td><td>Reflete a realidade?</td><td>Idade cadastrada como 150 anos.</td></tr>
          <tr><td><strong>Completude</strong></td><td>Faltam registros/campos?</td><td>CPF sem dígito verificador ou nulo.</td></tr>
          <tr><td><strong>Consistência</strong></td><td>Os dados batem entre sistemas?</td><td>Endereço diferente no RH e no Financeiro.</td></tr>
          <tr><td><strong>Tempestividade</strong></td><td>Estão atualizados no tempo certo?</td><td>Relatório de vendas de 2019 usado hoje.</td></tr>
          <tr><td><strong>Unicidade</strong></td><td>Há duplicatas?</td><td>Mesmo cliente cadastrado 3 vezes.</td></tr>
        </table>

        <h2>7.3 Engenharia e Limpeza</h2>
        <p><strong>Tratamento de Missing Values (Nulos):</strong></p>
        <ul>
          <li><em>Exclusão (Drop):</em> Apagar a linha. Perde informação, mas simples.</li>
          <li><em>Imputação:</em> Substituir por Média, Mediana ou usar um modelo preditivo para preencher.</li>
          <li><em>Flag:</em> Criar uma coluna "Era Nulo" para não perder o padrão do missing.</li>
        </ul>
        <p><strong>Normalização vs Padronização:</strong></p>
        <ul>
          <li><strong>Min-Max (Normalização):</strong> Escala os valores para [0, 1]. Fórmula: $(x - min) / (max - min)$.</li>
          <li><strong>Z-Score (Padronização):</strong> Centraliza na média 0 e desvio padrão 1. Fórmula: $(x - \mu) / \sigma$.</li>
        </ul>
        <p><strong>Anonimização:</strong> Remover PII (Personally Identifiable Information). Técnicas: K-Anonimidade (garante que cada registro seja indistinguível de pelo menos K-1 outros) e Diferencial Privacy (adiciona ruído matemático para impedir reidentificação).</p>

      theory: `
        <h2>8.1 Princípios e Gestalt</h2>
        <p>A <strong>Teoria da Gestalt</strong> explica como o cérebro agrupa elementos visuais. Princípios aplicados:</p>
        <ul>
          <li><strong>Proximidade:</strong> Itens próximos são vistos como grupo. (Use para agrupar legendas próximas aos dados).</li>
          <li><strong>Similaridade:</strong> Itens com mesma cor/forma são vistos como grupo. (Use cores consistentes para mesma categoria).</li>
          <li><strong>Fechamento:</strong> O cérebro completa formas incompletas. (Gráficos de linha usam isso).</li>
        </ul>
        <p><strong>Chartjunk:</strong> Todo elemento visual que não carrega informação (ex: 3D desnecessário, texturas, sombras). <em>Elimine o chartjunk!</em> O gráfico deve ter a maior "Taxa de Tinta de Dados" (Data-Ink Ratio) possível.</p>

        <table>
          <tr><th>Gráfico</th><th>Melhor Para</th><th>Quando Evitar</th><th>Pegadinha</th></tr>

          <tr><td><strong>Linha</strong></td><td>Séries temporais (Tendência).</td><td>Dados sem ordem cronológica.</td><td>Escala do eixo Y pode enganar (zoom exagerado).</td></tr>

          <tr><td><strong>Dispersão (Scatter)</strong></td><td>Correlação entre 2 variáveis numéricas.</td><td>Causa e efeito (correlação não é causalidade!).</td><td>Outliers são visíveis e importantes.</td></tr>
          <tr><td><strong>Box Plot</strong></td><td>Estatística descritiva e Outliers.</td><td>Audiência leiga (difícil de ler).</td><td>Mostra Mediana, Quartis (Q1, Q3) e IQR. Ponto fora da linha é outlier.</td></tr>

// ESTADO E PERSISTÊNCIA
// ==========================================
const State = {
  currentModule: 'msoffice',
  progress: {},
  flashcards: {},
  quizScores: {},
  ttsRate: 1,
  theme: 'dark',
  load() {
    try {
      const s = localStorage.getItem('apostila_ti_state_v3');
      if (s) {
        const d = JSON.parse(s);
        this.progress = d.progress || {};
        this.flashcards = d.flashcards || {};
        this.quizScores = d.quizScores || {};
        this.theme = d.theme || 'dark';
      }
    } catch(e) { console.error(e); }
  },
  save() {
    try {
      localStorage.setItem('apostila_ti_state_v3', JSON.stringify({
        progress: this.progress,
        flashcards: this.flashcards,
        quizScores: this.quizScores,
        theme: this.theme
      }));
    } catch(e) {}
  }
};

  rateCard(modId, idx, quality) {
    const card = State.flashcards[modId][idx];
    if (quality < 3) { card.reps = 0; card.interval = 1; }
    else if (quality === 3) { card.interval = Math.max(1, Math.round(card.interval * 1.2)); card.ease = Math.max(1.3, card.ease - 0.2); }
    else {
      card.reps++;
      if (card.reps === 1) card.interval = 1;
      else if (card.reps === 2) card.interval = 6;
      else card.interval = Math.round(card.interval * card.ease);
      card.ease += 0.1;
    }
    State.save();
    alert(`Avaliado! Próxima revisão em ${card.interval} dia(s).`);

    if (selected === -1) { alert('Selecione uma alternativa.'); return; }

    const labels = document.querySelectorAll(`[name="q${modId}_${qIdx}"]`);
    labels.forEach((r, i) => {
      const lbl = r.parentElement;
      if (i === q.ans) lbl.classList.add('correct');

  search(q) {
    if (q.length < 3) {
      document.getElementById('content-area').querySelectorAll('.highlight').forEach(el => {
        el.outerHTML = el.innerHTML;
      });
      return;
    }
    const activeTab = document.querySelector('.tab-content.active');
    if (!activeTab) return;
    
    // Limpa highlights anteriores
    activeTab.querySelectorAll('.highlight').forEach(el => el.outerHTML = el.innerHTML);
    
    // Aplica novo highlight
    const regex = new RegExp(`(${q})`, 'gi');
    const walker = document.createTreeWalker(activeTab, NodeFilter.SHOW_TEXT, null, false);
    let node;
    while(node = walker.nextNode()) {
      if (node.nodeValue.toLowerCase().includes(q.toLowerCase())) {
        const span = document.createElement('span');
        span.innerHTML = node.nodeValue.replace(regex, '<mark class="highlight">$1</mark>');
        node.parentNode.replaceChild(span, node);
      }
    }
  },

  ttsPlay() {
    window.speechSynthesis.cancel();
    const activeTab = document.querySelector('.tab-content.active');
    if (!activeTab) return;
    const text = activeTab.innerText.substring(0, 3000); // Limita para não travar
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'pt-BR';
    utter.rate = State.ttsRate;
    window.speechSynthesis.speak(utter);

    const cols = ['A','B','C','D','E'];
    for (let r = 1; r <= 5; r++) {
      grid.innerHTML += `<div class="hdr">${r}</div>`;
      for (let c = 0; c < 5; c++) {

  calcExcel() {
    const formula = document.getElementById('excel-formula').value.toUpperCase().trim();
    const out = document.getElementById('excel-output');
    if (!formula) { out.innerText = 'Digite uma fórmula.'; return; }
    
    const getVal = (ref) => {
      const el = document.getElementById('cell-' + ref);
      return el ? parseFloat(el.value) || 0 : 0;
    };
    
    const getRange = (range) => {
      const [start, end] = range.split(':');
      const sCol = start[0], sRow = parseInt(start[1]);
      const eCol = end[0], eRow = parseInt(end[1]);
      let vals = [];
      for (let c = sCol.charCodeAt(0); c <= eCol.charCodeAt(0); c++) {
        for (let r = sRow; r <= eRow; r++) {
          vals.push(getVal(String.fromCharCode(c) + r));
        }
      }
      return vals;
    };

    try {
      let result = 'Erro de sintaxe';
      if (formula.startsWith('=')) {
        const f = formula.substring(1);
        if (f.startsWith('SOMA(')) {
          const range = f.substring(5, f.length-1);
          result = getRange(range).reduce((a,b) => a+b, 0);
        } else if (f.startsWith('MEDIA(')) {
          const range = f.substring(6, f.length-1);
          const vals = getRange(range);
          result = vals.reduce((a,b) => a+b, 0) / vals.length;
        } else if (f.startsWith('SE(')) {
          const parts = f.substring(3, f.length-1).split(';');
          const cond = parts[0].replace(/([A-E]\d)/g, 'getVal("$1")');
          const t = parts[1], fa = parts[2];
          const r = eval(cond);
          result = r ? t.replace(/"/g,'') : fa.replace(/"/g,'');
        } else if (f.startsWith('CONT.SE(')) {
          const parts = f.substring(8, f.length-1).split(';');
          const vals = getRange(parts[0]);
          const crit = parseFloat(parts[1]) || parts[1].replace(/"/g,'');
          result = vals.filter(v => v == crit).length;
        } else {
          // Avaliação aritmética simples
          const exp = f.replace(/([A-E]\d)/g, 'getVal("$1")');
          result = eval(exp);
        }
      }
      out.innerText = `> ${formula}\n\nRESULTADO: ${result}`;
    } catch(e) {
      out.innerText = `ERRO: ${e.message}`;
    }
  },

  judgePhish(i, guessPhish) {
    const email = window._phishData[i];
    const exp = document.getElementById('phish-exp-' + i);
    const correct = (guessPhish === email.isPhish);
    exp.innerHTML = `<strong>${correct ? '✅ ACERTOU!' : '❌ ERROU!'} Diagnóstico:</strong> ${email.reason}`;
    exp.classList.add('show');
  },

  initPrompt() {
    // Apenas bind, o botão já chama evalPrompt
  },

  evalPrompt() {
    const txt = document.getElementById('prompt-input').value;
    const out = document.getElementById('prompt-output');
    if (!txt.trim()) { out.innerText = 'Digite um prompt.'; return; }
    
    const checks = {
      'Persona': /atue como|você é|aja como|papel|especialista/gi.test(txt),
      'Contexto': /contexto|cenário|dado que|considerando|fundo/gi.test(txt),
      'Tarefa': /crie|analise|escreva|gere|liste|resuma|explique/gi.test(txt),
      'Restrição': /não|evite|limite|sem|proibido|jamais/gi.test(txt),
      'Formato': /tabela|json|lista|markdown|bullet|formato|tom/gi.test(txt)
    };

    let score = 0;
    let feedback = 'ANÁLISE ESTRUTURAL DO PROMPT\n=============================\n\n';
    for (let k in checks) {
      const icon = checks[k] ? '✅' : '❌';
      feedback += `${icon} ${k}: ${checks[k] ? 'Detectado' : 'AUSENTE'}\n`;
      if (checks[k]) score++;
    }
    
    feedback += `\nPONTUAÇÃO: ${score}/5\n\n`;
    if (score < 3) feedback += '⚠️ Prompt muito fraco. Adicione Persona, Restrições e Formato de saída para resultados profissionais.';
    else if (score < 5) feedback += '💡 Bom prompt! Para excelência, adicione os componentes faltantes.';
    else feedback += '🏆 PROMPT NÍVEL MASTER! Estrutura completa para LLMs de alta performance.';

    out.innerText = feedback;
  },

  initChart() {
    this.genChart();
    document.getElementById('chart-type').addEventListener('change', () => this.genChart());
  },

  genChart() {
    const type = document.getElementById('chart-type').value;
    const canvas = document.getElementById('main-chart');
    const svg = document.getElementById('boxplot-svg');
    const insight = document.getElementById('chart-insight');
    
    if (window.myChart) window.myChart.destroy();
    canvas.style.display = 'block';
    svg.style.display = 'none';

    let labels = [], data = [], insights = '';

    if (type === 'bar') {
      labels = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun'];
      data = labels.map(() => Math.floor(Math.random()*100)+20);
      insights = '<strong>Gráfico de Barras:</strong> Ideal para comparar categorias discretas. Note que o eixo Y inicia em zero para não distorcer a percepção visual das diferenças.';
    } else if (type === 'line') {
      labels = ['2018', '2019', '2020', '2021', '2022', '2023', '2024'];
      data = [10, 15, 12, 25, 30, 28, 45]; // Tendência de alta
      insights = '<strong>Gráfico de Linha:</strong> Perfeito para séries temporais. A linha mostra a tendência de crescimento ao longo dos anos. Cuidado com a escala do eixo Y que pode exagerar pequenas variações.';
    } else if (type === 'scatter') {
      data = Array.from({length: 30}, () => ({
        x: Math.random()*100,
        y: (Math.random()*100) + (Math.random()*20) // Correlação positiva fraca
      }));
      insights = '<strong>Gráfico de Dispersão:</strong> Mostra a relação entre duas variáveis numéricas. Aqui vemos uma correlação positiva: à medida que X aumenta, Y tende a aumentar. LEMBRE-SE: Correlação NÃO implica Causalidade!';
    } else if (type === 'histogram') {
      // Gerar dados normais
      const raw = Array.from({length: 500}, () => {
        let u = 0, v = 0;
        while(u === 0) u = Math.random();
        while(v === 0) v = Math.random();
        return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
      }).map(n => Math.round((n * 15) + 100)); // Média 100, DP 15 (QI)
      
      // Bin
      labels = ['70-80', '80-90', '90-100', '100-110', '110-120', '120-130'];
      data = [0,0,0,0,0,0];
      raw.forEach(v => {
        if (v<80) data[0]++;
        else if (v<90) data[1]++;
        else if (v<100) data[2]++;
        else if (v<110) data[3]++;
        else if (v<120) data[4]++;
        else data[5]++;
      });
      insights = '<strong>Histograma:</strong> Mostra a DISTRIBUIÇÃO de uma variável contínua. Aqui temos uma Curva Normal (Sino) típica de QI. As barras são COLADAS pois representam intervalos contínuos, não categorias distintas.';
    } else if (type === 'boxplot') {
      canvas.style.display = 'none';
      svg.style.display = 'block';
      this.drawBoxplot(svg);
      insight.innerHTML = '<strong>Box Plot (Diagrama de Caixa):</strong> Exibe a estatística descritiva de 4 grupos. A linha na caixa é a MEDIANA. As bordas da caixa são Q1 (25%) e Q3 (75%). Os "bigodes" (whiskers) vão até 1.5*IQR. Pontos fora são OUTLIERS.';
      return;
    }

    const config = {
      type: type === 'histogram' ? 'bar' : type,
      data: {
        labels: labels,
        datasets: [{
          label: 'Dados Simulados',
          data: data,
          backgroundColor: type==='scatter' ? 'rgba(59, 130, 246, 0.5)' : 'rgba(59, 130, 246, 0.7)',
          borderColor: '#3b82f6',
          borderWidth: type==='scatter' ? 0 : 2,
          pointRadius: type==='scatter' ? 5 : 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#f8fafc' } } },
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' }, beginAtZero: type==='bar' }
        }
      }
    };
    window.myChart = new Chart(canvas, config);
    insight.innerHTML = insights;
  },

  drawBoxplot(svg) {
    svg.innerHTML = '';
    const w = svg.clientWidth || 800;
    const h = 400;
    const groups = ['Grupo A', 'Grupo B', 'Grupo C', 'Grupo D'];
    const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444'];
    
    groups.forEach((g, i) => {
      // Dados aleatórios
      let vals = Array.from({length: 50}, () => Math.random()*100 + i*10);
      if (i===2) vals.push(180, 190); // Adiciona outliers
      vals.sort((a,b) => a-b);
      
      const q1 = vals[Math.floor(vals.length * 0.25)];
      const q3 = vals[Math.floor(vals.length * 0.75)];
      const med = vals[Math.floor(vals.length * 0.5)];
      const min = vals[0];
      const max = vals[vals.length-1];
      const iqr = q3 - q1;
      const wLow = Math.max(min, q1 - 1.5*iqr);
      const wHigh = Math.min(max, q3 + 1.5*iqr);
      
      const x = (w / 5) * (i + 1);
      const boxW = 60;
      const scaleY = (v) => h - 50 - (v/200 * (h-100));
      
      // Caixa
      svg.innerHTML += `<rect x="${x-boxW/2}" y="${scaleY(q3)}" width="${boxW}" height="${scaleY(q1)-scaleY(q3)}" fill="${colors[i]}" opacity="0.6" stroke="white" />`;
      // Mediana
      svg.innerHTML += `<line x1="${x-boxW/2}" y1="${scaleY(med)}" x2="${x+boxW/2}" y2="${scaleY(med)}" stroke="white" stroke-width="3" />`;
      // Whiskers
      svg.innerHTML += `<line x1="${x}" y1="${scaleY(wLow)}" x2="${x}" y2="${scaleY(q1)}" stroke="white" stroke-dasharray="4" />`;
      svg.innerHTML += `<line x1="${x}" y1="${scaleY(q3)}" x2="${x}" y2="${scaleY(wHigh)}" stroke="white" stroke-dasharray="4" />`;
      svg.innerHTML += `<line x1="${x-20}" y1="${scaleY(wLow)}" x2="${x+20}" y2="${scaleY(wLow)}" stroke="white" />`;
      svg.innerHTML += `<line x1="${x-20}" y1="${scaleY(wHigh)}" x2="${x+20}" y2="${scaleY(wHigh)}" stroke="white" />`;
      // Outliers
      vals.forEach(v => {
        if (v < wLow || v > wHigh) {
          svg.innerHTML += `<circle cx="${x}" cy="${scaleY(v)}" r="4" fill="red" stroke="white" />`;
        }
      });
      // Label
      svg.innerHTML += `<text x="${x}" y="${h-20}" text-anchor="middle" fill="white" font-weight="bold">${g}</text>`;
    });
  },

  renderModuleHook() {
    this.initSimulators();
  }
};

// Override renderModule to init simulators
const origRender = App.renderModule;
App.renderModule = function(id) {
  origRender.call(this, id);
  this.initSimulators();
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
