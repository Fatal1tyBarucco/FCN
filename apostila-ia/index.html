<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apostila Web Interativa — Tecnologia da Informação, Dados e IA</title>
<meta name="description" content="Apostila web interativa: 8 modulos, simuladores, flashcards, questoes, graficos. Abra direto ou via localhost:8080">
<link rel="stylesheet" href="assets/css/styles.css">
<meta name="theme-color" content="#1e2b40">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f8fafc; --text-dim: #94a3b8;
  --primary: #3b82f6; --success: #10b981; --error: #ef4444; --warning: #f59e0b; --accent: #8b5cf6;
  --radius: 8px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
}
[data-theme="light"] {
  --bg: #f1f5f9; --surface: #ffffff; --border: #cbd5e1; --text: #0f172a; --text-dim: #475569;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;display:flex;min-height:100vh;overflow-x:hidden}
#sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);height:100vh;position:sticky;top:0;overflow-y:auto;padding:1rem;flex-shrink:0;z-index:100}
#sidebar h2{font-size:1.2rem;text-align:center;border:none;padding:0;margin-bottom:1.5rem;color:var(--primary)}
#sidebar .nav-item{display:block;padding:12px;border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:.2s;color:var(--text-dim);border-left:3px solid transparent;font-weight:500}
#sidebar .nav-item:hover{background:#ffffff10;color:var(--text)}
#sidebar .nav-item.active{background:var(--primary);color:#fff;border-left-color:var(--warning)}
#sidebar .progress-mini{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
#sidebar .progress-mini-bar{height:100%;background:var(--success);width:0;transition:width .3s}
#main{flex:1;padding:2rem;max-width:1200px;margin:0 auto;width:100%}
#header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;z-index:90;backdrop-filter:blur(10px);margin:-2rem -2rem 2rem -2rem;width:calc(100% + 4rem)}
#header .left{display:flex;align-items:center;gap:1rem}
#header .progress-global{width:200px;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
#header .progress-global-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0;transition:width .5s}
#header .search-box{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);width:300px;font-size:.9rem}
#header .btn{padding:8px 16px;border-radius:var(--radius);border:none;background:var(--primary);color:#fff;cursor:pointer;font-weight:bold;transition:.2s}
#header .btn:hover{opacity:.9;transform:translateY(-1px)}
#header .btn-sec{background:var(--surface);color:var(--text);border:1px solid var(--border)}
#header .tts-controls{display:flex;gap:.5rem;align-items:center;background:var(--surface);padding:8px;border-radius:20px}
#header .tts-controls button{background:none;border:none;color:var(--text);font-size:1.2rem;cursor:pointer;padding:4px 8px}
#header .tts-controls select{background:var(--bg);color:var(--text);border:none;padding:4px;border-radius:4px}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:1.5rem;overflow-x:auto}
.tab{padding:12px 24px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;color:var(--text-dim);white-space:nowrap;transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{border-bottom-color:var(--primary);color:var(--primary)}
.tab-content{display:none;animation:fadeIn .3s}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem;box-shadow:var(--shadow)}
.modal{display:none;position:fixed;inset:0;background:#000000cc;z-index:1000;justify-content:center;align-items:center;padding:2rem}
.modal.show{display:flex}
.modal-content{background:var(--surface);border-radius:var(--radius);padding:2rem;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--text);font-size:1.5rem;cursor:pointer}
.mark-complete{display:block;width:100%;padding:12px;background:var(--success);color:#fff;border:none;border-radius:var(--radius);font-weight:bold;font-size:1.1rem;cursor:pointer;margin-top:2rem;transition:.2s}
.mark-complete:hover{background:#059669}
.mark-complete.completed{background:var(--border);color:var(--text-dim);cursor:default}
.search-highlight{background:#f59e0b40;padding:2px 4px;border-radius:2px}
.hidden{display:none!important}
@media(max-width:768px){body{flex-direction:column}#sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border)}#main{padding:1rem}#header{flex-direction:column;gap:1rem;width:100%;margin:0 0 1rem 0;padding:1rem}}
</style>
</head>

    </div>
    <div class="right flex">
      <input type="text" id="search-input" class="search-box" placeholder="🔍 Buscar em toda a apostila...">
      <div class="tts-controls">
        <button id="tts-play" title="Ouvir">🔊</button>
        <button id="tts-pause" title="Pausar">⏸️</button>
        <select id="tts-rate" title="Velocidade">
          <option value="0.8">0.8x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.2">1.2x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>
      <button class="btn btn-sec" id="theme-toggle">🌓 Tema</button>
    </div>
  </div>
  <div id="content-area">
    <div id="teoria-host"></div>

<div id="curriculum" aria-label="Inventário curricular resumido"></div>

<script>
(function(){'use strict';
var fundidos=[];var vistos=Object.create?Object.create(null):{};
function addBanco(banco,nome){if(!Array.isArray(banco))return;banco.forEach(function(q){
if(!q||typeof q.id==='undefined')return;
if(Object.prototype.hasOwnProperty.call(vistos,q.id)){console.warn('[questoes-fusao] duplicado: '+q.id+' ('+nome+')');return;}
vistos[q.id]=true;fundidos.push(q);});}
addBanco(window.questoesBanco,'questions.js');
if(typeof moduleQuestions4!=='undefined')addBanco(moduleQuestions4,'m4');
if(typeof moduleQuestions5!=='undefined')addBanco(moduleQuestions5,'m5');
if(typeof moduleQuestions6!=='undefined')addBanco(moduleQuestions6,'m6');
if(typeof moduleQuestions7!=='undefined')addBanco(moduleQuestions7,'m7');
if(typeof moduleQuestions8!=='undefined')addBanco(moduleQuestions8,'m8');
window.questoesBanco=fundidos;
if(window.apostilaDados)window.apostilaDados.questoes=window.questoesBanco;
})();
</script>

<script>
(function(){'use strict';
function montarSimulador(nomeGlobal,idConteiner){
try{var el=document.getElementById(idConteiner);
if(!el){console.warn('[sim] container ausente: '+idConteiner);return;}
var Sim=window[nomeGlobal];
if(!Sim||typeof Sim.mount!=='function'){console.warn('[sim] nucleo ausente: '+nomeGlobal);return;}
Sim.mount(el);}catch(e){console.warn('[sim] falha '+nomeGlobal+': '+((e&&e.message)?e.message:e));}}
document.addEventListener('DOMContentLoaded',function(){
montarSimulador('ExcelSimulator','excel-app');
montarSimulador('NetworkSimulator','redes-app');
montarSimulador('SecuritySimulator','seguranca-app');
montarSimulador('PromptSimulator','prompts-app');
montarSimulador('DataSimulator','dados-app');
montarSimulador('EthicsSimulator','etica-app');
});})();
</script>

<script>
if('serviceWorker'in navigator){navigator.serviceWorker.register('service-worker.js').catch(function(){});}
</script>
