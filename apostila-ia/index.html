<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apostila Web Interativa — Tecnologia da Informação, Dados e IA</title>
<meta name="description" content="Apostila web interativa: 8 modulos, simuladores, flashcards, 409 questões, 474 flashcards, gráficos. Abra direto ou via localhost:8080">
<link rel="stylesheet" href="assets/css/styles.css">
<meta name="theme-color" content="#1e2b40">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f8fafc; --text-dim: #94a3b8;
  --primary: #1d4ed8; --success: #10b981; --error: #ef4444; --warning: #f59e0b; --accent: #8b5cf6;
  --radius: 8px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
}
[data-theme="light"] {
  --bg: #f1f5f9; --surface: #ffffff; --border: #cbd5e1; --text: #0f172a; --text-dim: #475569;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;display:flex;min-height:100vh;overflow-x:hidden}
body.app-shell-ready{display:block}
h1,h2,h3,h4{color:var(--text);margin-bottom:1rem;line-height:1.2}
h1{font-size:2.2rem;border-bottom:3px solid var(--primary);padding-bottom:.5rem}
h2{font-size:1.6rem;color:var(--primary);border-left:4px solid var(--primary);padding-left:1rem;margin-top:2rem}
h3{font-size:1.3rem;margin-top:1.5rem;color:var(--accent)}
p{margin-bottom:1rem;color:var(--text)}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
code{background:#00000040;padding:2px 6px;border-radius:4px;font-family:'Fira Code',monospace;font-size:.9em;color:#fbbf24}
pre{background:#00000080;padding:1rem;border-radius:var(--radius);overflow-x:auto;margin:1rem 0;border-left:4px solid var(--accent)}
pre code{background:none;padding:0;color:#e2e8f0}
ul,ol{margin-left:2rem;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;margin:1rem 0;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--primary);color:#fff;font-weight:600;text-transform:uppercase;font-size:.85rem}
tr:nth-child(even){background:#ffffff05}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:.75rem;font-weight:bold;text-transform:uppercase}
.badge-blue{background:#1e3a8a;color:#93c5fd}
.badge-green{background:#064e3b;color:#6ee7b7}
.badge-red{background:#7f1d1d;color:#fca5a5}
.badge-yellow{background:#78350f;color:#fcd34d}
.badge-purple{background:#4c1d95;color:#c4b5fd}
#main{flex:1;padding:2rem;max-width:1200px;margin:0 auto;width:100%}
#header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;z-index:90;backdrop-filter:blur(10px);margin:-2rem -2rem 2rem -2rem;width:calc(100% + 4rem)}
#header .left{display:flex;align-items:center;gap:1rem}
#header .progress-global{width:200px;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
#header .progress-global-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0;transition:width .5s}
#header .search-box{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);width:300px;font-size:.9rem}
#header .btn{padding:8px 16px;border-radius:var(--radius);border:none;background:var(--primary);color:#fff;cursor:pointer;font-weight:bold;transition:.2s}
#header .btn:hover{opacity:.9;transform:translateY(-1px)}
#header .btn-sec{background:var(--surface);color:var(--text);border:1px solid var(--border)}
#header .tts-controls{display:flex;gap:.5rem;align-items:center;background:var(--surface);padding:8px;border-radius:20px}
#header .tts-controls button{background:none;border:none;color:var(--text);font-size:1.2rem;cursor:pointer;padding:4px 8px}
#header .tts-controls select{background:var(--bg);color:var(--text);border:none;padding:4px;border-radius:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem;box-shadow:var(--shadow)}
.card h3{margin-top:0}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:1.5rem;overflow-x:auto}
.tab{padding:12px 24px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;color:var(--text-dim);white-space:nowrap;transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{border-bottom-color:var(--primary);color:var(--primary)}
.tab-content{display:none;animation:fadeIn .3s}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
details{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem 0}
summary{cursor:pointer;font-weight:bold;color:var(--primary);padding:.5rem}
summary:hover{color:var(--accent)}
.fc-deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-top:1rem}
.fc-card{height:200px;perspective:1000px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;text-align:center;transition:transform .6s;transform-style:preserve-3d}
.fc-card.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);padding:1.5rem;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:var(--shadow);overflow-y:auto}
.fc-front{background:var(--primary);color:#fff;font-weight:bold;font-size:1.1rem}
.fc-back{background:var(--surface);color:var(--text);border:2px solid var(--primary);transform:rotateY(180deg);font-size:.95rem}
.fc-actions{display:flex;gap:.5rem;margin-top:1rem;width:100%}
.fc-actions button{flex:1;padding:8px;border:none;border-radius:4px;font-weight:bold;cursor:pointer;color:#fff}
.fc-btn-easy{background:var(--success)}
.fc-btn-hard{background:var(--warning)}
.fc-btn-wrong{background:var(--error)}
.quiz-q{background:var(--surface);border-left:4px solid var(--accent);padding:1.5rem;margin-bottom:1.5rem;border-radius:var(--radius)}
.quiz-opts label{display:block;padding:12px;border:1px solid var(--border);border-radius:var(--radius);margin:8px 0;cursor:pointer;transition:.2s}
.quiz-opts label:hover{background:rgba(255,255,255,0.05);border-color:var(--primary)}
.quiz-opts input{margin-right:10px}
.quiz-opts label.correct{background:rgba(16,185,129,0.18);border-color:var(--success)}
.quiz-opts label.wrong{background:rgba(239,68,68,0.18);border-color:var(--error)}
.quiz-exp{display:none;background:rgba(0,0,0,0.15);padding:1rem;border-radius:var(--radius);margin-top:1rem;border-left:3px solid var(--warning);font-size:.9rem}
.quiz-exp.show{display:block}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:1rem}
.sim-input textarea,.sim-input input{width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;font-family:inherit}
.sim-output{background:#000;color:#0f0;padding:1rem;border-radius:var(--radius);font-family:monospace;min-height:200px;white-space:pre-wrap}
.excel-grid{display:grid;grid-template-columns:40px repeat(5,1fr);gap:2px;background:var(--border);padding:2px;border-radius:4px;margin-bottom:1rem}
.excel-grid input{width:100%;padding:8px;border:none;background:var(--surface);color:var(--text);text-align:center;font-size:.9rem}
.excel-grid .hdr{background:var(--primary);color:#fff;font-weight:bold;padding:8px;text-align:center}
.phish-email{border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem;background:var(--surface)}
.phish-email .hdr{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:.5rem;margin-bottom:.5rem;font-size:.9rem}
.phish-btn{flex:1;padding:10px;border:none;border-radius:4px;cursor:pointer;font-weight:bold;color:#fff}
.phish-btn.safe{background:var(--success)}
.phish-btn.danger{background:var(--error)}
.chart-controls{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.chart-controls select,.chart-controls button{padding:8px 12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;cursor:pointer}
.chart-container{background:var(--surface);padding:1.5rem;border-radius:var(--radius);height:400px;position:relative}
.modal{display:none;position:fixed;inset:0;background:#000000cc;z-index:1000;justify-content:center;align-items:center;padding:2rem}
.modal.show{display:flex}
.modal-content{background:var(--surface);border-radius:var(--radius);padding:2rem;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--text);font-size:1.5rem;cursor:pointer}
@media(max-width:768px){body{flex-direction:column}#main{padding:1rem}#header{flex-direction:column;gap:1rem;width:100%;margin:0 0 1rem 0;padding:1rem}#header .search-box{width:100%}.sim-grid{grid-template-columns:1fr}}
.text-center{text-align:center}
.mt-1{margin-top:1rem}
.mb-1{margin-bottom:1rem}
.flex{display:flex;gap:1rem}
.flex-1{flex:1}
.hidden{display:none!important}
.search-highlight{background:rgba(245,158,11,0.25);padding:2px 4px;border-radius:2px}
.search-highlight-inner{background:rgba(245,158,11,0.25);padding:2px 4px;border-radius:2px}
.mermaid{display:flex;justify-content:center;margin:1rem 0}
.mermaid svg{max-width:100%;height:auto}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:1rem 0}
.info-box{background:linear-gradient(135deg,var(--surface),#ffffff10);border:1px solid var(--border);padding:1.5rem;border-radius:var(--radius);text-align:center;transition:.3s}
.info-box:hover{transform:translateY(-5px);border-color:var(--primary);box-shadow:0 10px 20px #00000040}
.info-box .icon{font-size:2.5rem;margin-bottom:.5rem}
.info-box h4{color:var(--primary);font-size:1.1rem;margin-bottom:.5rem}
.video-wrapper{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--radius);margin:1rem 0;border:2px solid var(--border)}
.video-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%}
.mark-complete{display:block;width:100%;padding:12px;background:var(--success);color:#fff;border:none;border-radius:var(--radius);font-weight:bold;font-size:1.1rem;cursor:pointer;margin-top:2rem;transition:.2s}
.mark-complete:hover{background:#059669}
.mark-complete.completed{background:var(--border);color:var(--text-dim);cursor:default}
/* Module navigation — app.js renders .nav-item into #nav-list (inside #app-sidebar after ui-shell.js) */
.sidebar-nav-list{padding:0 1rem 1.5rem}
.nav-item{display:block;padding:12px;border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:.2s;color:var(--text-dim);border-left:3px solid transparent;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff;border-left-color:var(--warning)}
.progress-mini{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.progress-mini-bar{height:100%;background:var(--success);width:0;transition:width .3s}
</style>
</head>
<body>

<!-- Main content: app.js SPA tab system -->
<main id="main" tabindex="-1">
  <!-- Top bar header: progress, live search, TTS, theme toggle -->
  <header id="header">
    <div class="left">
      <strong>Progresso Global:</strong>
      <div class="progress-global"><div class="progress-global-bar" id="global-progress"></div></div>
      <span id="progress-text">0%</span>
    </div>
    <div class="right flex">
      <input type="text" id="search-input" class="search-box" placeholder="🔍 Buscar em toda a apostila..." title="Buscar em toda a apostila" aria-label="Buscar em toda a apostila">
      <div class="tts-controls">
        <button id="tts-play" title="Ouvir (Text-to-Speech)">🔊</button>
        <button id="tts-pause" title="Pausar leitura">⏸️</button>
        <select id="tts-rate" title="Velocidade de leitura" aria-label="Velocidade de leitura">
          <option value="0.8">0.8x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.2">1.2x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>
      <button class="btn btn-sec" id="theme-toggle" title="Alternar tema escuro/claro">🌓 Tema</button>
    </div>
  </header>

  <!-- app.js renders module tabs dynamically into #content-area -->
  <div id="content-area"></div>
</main>

<!-- Simulator containers (off-screen; app.js moves them into tab content on demand) -->
<div id="simulator-containers" style="position:absolute;left:0;top:0;width:1200px;height:800px;overflow:visible;">
  <div id="charts-app"></div>
  <div id="excel-app"></div>
  <div id="redes-app"></div>
  <div id="seguranca-app"></div>
  <div id="prompts-app"></div>
  <div id="dados-app"></div>
  <div id="etica-app"></div>
</div>

<!-- Old-system engine containers (outside #content-area so app.js tab renderer
     never wipes them; ui-shell.js repositions #curriculum tree into the sidebar) -->
<div id="curriculum" aria-label="Inventário curricular resumido"></div>
<div id="flashcards-app"></div>
<div id="quiz-app"></div>
<div id="search-app" aria-label="Busca global"></div>
<div id="audio-app" aria-label="Leitura em voz alta"></div>
<div id="progress-app" aria-label="Painel de progresso"></div>
<div id="accessibility-app" role="region" aria-label="Acessibilidade" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);"></div>

<!-- Modal para Flashcards e Quiz -->
<div id="modal" class="modal">
  <div class="modal-content">
    <button class="modal-close" id="modal-close" aria-label="Fechar modal" onclick="App.closeModal()">✖</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function(){'use strict';
var fundidos=[];var vistos=Object.create?Object.create(null):{};
function addBanco(banco,nome){if(!Array.isArray(banco))return;banco.forEach(function(q){
if(!q||typeof q.id==='undefined')return;
if(Object.prototype.hasOwnProperty.call(vistos,q.id)){console.warn('[questoes-fusao] duplicado: '+q.id+' ('+nome+')');return;}
vistos[q.id]=true;fundidos.push(q);});}
addBanco(window.questoesBanco,'questions.js');
if(typeof moduleQuestions4!=='undefined')addBanco(moduleQuestions4,'m4');
if(typeof moduleQuestions5!=='undefined')addBanco(moduleQuestions5,'m5');
if(typeof moduleQuestions6!=='undefined')addBanco(moduleQuestions6,'m6');
if(typeof moduleQuestions7!=='undefined')addBanco(moduleQuestions7,'m7');
if(typeof moduleQuestions8!=='undefined')addBanco(moduleQuestions8,'m8');
window.questoesBanco=fundidos;
if(window.apostilaDados)window.apostilaDados.questoes=window.questoesBanco;
})();
</script>

<script src="assets/js/audio.js" defer></script>

<script>
(function(){'use strict';
function montarSimulador(nomeGlobal,idConteiner){
try{
var el=document.getElementById(idConteiner);
if(!el){console.warn('[sim] container ausente: '+idConteiner);return;}
var Sim=window[nomeGlobal];
if(!Sim||typeof Sim.mount!=='function'){console.warn('[sim] nucleo ausente: '+nomeGlobal);return;}
Sim.mount(el);
}catch(e){console.warn('[sim] falha '+nomeGlobal+': '+((e&&e.message)?e.message:e));}
}
document.addEventListener('DOMContentLoaded',function(){
montarSimulador('ExcelSimulator','excel-app');
montarSimulador('NetworkSimulator','redes-app');
montarSimulador('SecuritySimulator','seguranca-app');
montarSimulador('PromptSimulator','prompts-app');
montarSimulador('DataSimulator','dados-app');
montarSimulador('EthicsSimulator','etica-app');
});
})();
</script>

<script>
if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('service-worker.js').catch(function(){});}
</script>
